name: WEEX RADAR safety checks
on:
  push:
    branches: [main, feature/weex-manual-trade-preview]
  pull_request:
  # Allow V110's GITHUB_TOKEN to request an explicit verification run.
  # Pull requests opened by GITHUB_TOKEN do not trigger ordinary PR workflows.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Run checks
        run: npm test
