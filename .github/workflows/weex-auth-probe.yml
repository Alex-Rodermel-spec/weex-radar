name: WEEX RADAR — protected account diagnosis
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weex-auth-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  read-only-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test signed account read without placing any order
        shell: bash
        run: |
          set -euo pipefail
          oidc_response="$(curl --silent --show-error --fail --max-time 20 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=weex-radar-auth-probe")"
          token="$(echo "$oidc_response" | jq -r '.value')"
          test -n "$token" && test "$token" != null
          temp="$(mktemp)"
          status="$(curl --silent --show-error --max-time 25 \
            -o "$temp" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/json' \
            'https://weex-radar.vercel.app/api/weex-auth-probe')"
          echo "Result HTTP: $status"
          jq -c '{ok,stage,code,ordersSent}' "$temp"
          if [[ "$status" != "200" ]]; then
            echo "::warning::WEEX account authentication is not yet verified (read-only probe)"
          fi

# Last verified after API key update (read-only probe, 2026-11-07)
