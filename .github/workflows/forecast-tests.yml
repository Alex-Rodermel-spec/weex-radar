name: Forecast branch tests
on:
  pull_request:
  push:
    branches:
      - feature/forecast-entry-passkey-20261109

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run all tests
        run: npm test
