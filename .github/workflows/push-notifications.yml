name: WEEX RADAR — background push
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: weex-radar-push
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger push scanner using GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 2 --max-time 15 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=weex-radar-push")"
          jwt="$(echo "$response" | jq -r '.value')"
          test -n "$jwt" && test "$jwt" != null
          curl --fail --silent --show-error --retry 2 --max-time 70 \
            -X POST -H "Authorization: Bearer ${jwt}" \
            -H 'Accept: application/json' \
            'https://weex-radar.vercel.app/api/push-dispatch'
