name: WEEX RADAR — background push
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/push-notifications.yml'
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: weex-radar-push
  cancel-in-progress: false
jobs:
  smoke-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger an authenticated single-scan test
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --fail-with-body --silent --show-error --retry 3 --max-time 20 \
            -o /dev/null -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/push-notifications.yml/dispatches" \
            -d '{"ref":"main"}')"
          test "$code" == "204"
          echo "Authenticated one-time scanner test has been queued"
  notify:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Scan every minute inside each scheduled five-minute window
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 2 --max-time 15 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=weex-radar-push")"
          jwt="$(echo "$response" | jq -r '.value')"
          test -n "$jwt" && test "$jwt" != null

          checks=5
          if [[ "${GITHUB_EVENT_NAME}" != "schedule" ]]; then checks=1; fi
          passed=0
          started="$(date +%s)"
          for ((i=1; i<=checks; i++)); do
            echo "::group::WEEX RADAR scan $i/$checks"
            body="$(mktemp)"
            http="$(curl --silent --show-error --retry 2 --max-time 70 \
              -o "$body" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${jwt}" \
              -H 'Accept: application/json' \
              'https://weex-radar.vercel.app/api/push-dispatch')" || http="000"
            if [[ "$http" == "200" ]] && jq -e '.ok == true' "$body" >/dev/null 2>&1; then
              jq -c '{ok,signals,subscribers,delivered,failed}' "$body"
              passed=$((passed+1))
            else
              echo "::warning::WEEX RADAR dispatch failed (HTTP $http)"
              head -c 400 "$body" || true
              echo
            fi
            rm -f "$body"
            echo "::endgroup::"
            if (( i < checks )); then
              target=$((started + i*60))
              now="$(date +%s)"
              if (( target > now )); then sleep "$((target-now))"; fi
            fi
          done
          if (( passed == 0 )); then
            echo "::error::All scheduled scanner calls failed"
            exit 1
          fi
