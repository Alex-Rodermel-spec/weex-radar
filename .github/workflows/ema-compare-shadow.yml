name: EMA 5m A/B paper research only
on:
  push:
    branches:
      - research/ema-5m-comparison-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ema-shadow:
    name: Historical closed-candle comparison (NO ORDERS)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only WEEX futures A/B candle replay
        run: node research/ema-compare-shadow.mjs
